<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meros B&B - Admin</title>
    <link rel="icon" type="image/png" href="logo-v2.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header-left">
            <div class="logo">
                <a href="index.html"
                    style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px;">
                    <img src="logo-v2.png" alt="Meros Logo" style="height: 50px; width: auto; object-fit: contain;">
                    <span>Meros B&B</span>
                </a>
            </div>
            <!-- Globe Language Switcher -->
            <div class="globe-lang-container">
                <button class="globe-btn" id="lang-toggle" aria-label="Select Language">
                    <i class="fas fa-globe"></i>
                </button>
                <div class="globe-dropdown" id="lang-dropdown">
                    <a href="#" data-lang="en">English</a>
                    <a href="#" data-lang="uz">O'zbek</a>
                    <a href="#" data-lang="ru">Русский</a>
                </div>
            </div>
        </div>
        <div class="hamburger" id="hamburger-btn">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <nav id="nav-menu">
            <a href="index.html" data-i18n="nav.home">Home</a>
            <a href="rooms.html" data-i18n="nav.rooms">Accommodation</a>
            <a href="tours.html" data-i18n="nav.tours">Tours</a>
            <a href="restaurant.html" data-i18n="nav.restaurant">Rooftop Dining</a>
            <a href="gallery.html" data-i18n="nav.gallery">Gallery</a>
            <a href="admin.html" class="active" data-i18n="nav.admin">Admin</a>
        </nav>
    </header>


    <main class="container" style="padding-top: 50px; min-height: 60vh;">
        <h1 style="text-align: center; margin-bottom: 30px;">Admin Panel</h1>

        <!-- Login Section -->
        <div id="admin-login" style="max-width: 400px; margin: 0 auto; text-align: center;">
            <input type="password" id="admin-password" placeholder="Enter Admin Password"
                style="padding: 10px; width: 70%; margin-bottom: 10px;">
            <button onclick="checkAdminPassword()" class="btn" style="padding: 10px 20px;">Login</button>
            <p id="login-error" style="color: red; display: none;">Incorrect Password</p>
        </div>

        <!-- Dashboard (Hidden by default) -->
        <div id="admin-dashboard" style="display: none;">
            <!-- Statistics Section -->
            <div class="stats-grid"
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px;">
                <!-- Global Visits -->
                <div class="stat-card"
                    style="background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; border-left: 4px solid #3498db;">
                    <h3 style="margin: 0; color: #7f8c8d; font-size: 14px;">Total Visitors</h3>
                    <p id="stat-total-visits"
                        style="margin: 5px 0 0; font-size: 24px; font-weight: bold; color: #2c3e50;">0</p>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div class="tabs" style="display: flex; gap: 10px;">
                    <button id="btn-pending" onclick="showTab('pending')" class="btn"
                        style="background: #e67e22;">Pending</button>
                    <button id="btn-approved" onclick="showTab('approved')" class="btn"
                        style="background: #27ae60;">Live</button>
                </div>
                <button onclick="logoutAdmin()" class="btn"
                    style="background: #c0392b; padding: 5px 15px; font-size: 14px;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>

            <!-- Pending Reviews -->
            <div id="pending-reviews-tab">
                <h3>Pending Approval</h3>
                <div id="pending-reviews-list"></div>
            </div>

            <!-- Approved Reviews -->
            <div id="approved-reviews-tab" style="display: none;">
                <h3>Live on Website</h3>
                <div id="approved-reviews-list"></div>
            </div>
        </div>
    </main>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="social-links-footer">
                <a href="https://www.facebook.com/meroskhiva" target="_blank" class="social-icon-footer">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://t.me/Jaloladdin_MATKARIMOV" target="_blank" class="social-icon-footer">
                    <i class="fab fa-telegram-plane"></i>
                </a>
                <a href="https://wa.me/998943153700" target="_blank" class="social-icon-footer">
                    <i class="fab fa-whatsapp"></i>
                </a>
            </div>

            <div class="footer-contacts">
                <a href="tel:+998943153700"><i class="fas fa-phone-alt"></i> +998 94 315 37 00</a>
                <a href="tel:+998887903293"><i class="fas fa-phone-alt"></i> +998 88 790 32 93</a>
            </div>

            <div class="copyright" data-i18n="footer.copyright">
                &copy; 2026 Meros B&B. All Rights Reserved.
            </div>
        </div>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script src="main.js"></script>
</body>

</html>

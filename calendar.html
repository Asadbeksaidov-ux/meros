<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meros Hotel - Booking</title>
    <link rel="stylesheet" href="calendar.css">
    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>
<body>
    


<section class="section">
    <h3>Booking Calendar</h3>
    
    <div id="calendar" class="calendar-container"></div>
    
    <form id="bookingForm" class="booking-form">
        
        <div class="form-group">
            <label for="checkin">Check-in</label>
            <input type="date" id="checkin" name="checkin_date" required>
        </div>
        
        <div class="form-group">
            <label for="checkout">Check-out</label>
            <input type="date" id="checkout" name="checkout_date" required>
        </div>
        
        <div class="form-group">
            <label for="user_name">Ismingiz</label>
            <input type="text" id="user_name" name="user_name" required> 
        </div>
        
        <div class="form-group">
            <label for="user_email">Email manzilingiz</label>
            <input type="email" id="user_email" name="user_email" required>
        </div>
        
        <div class="form-group small">
            <label for="adults">Adults</label>
            <select id="adults" name="adults_count">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
        </div>

        <div class="form-group small">
            <label for="children">Children</label>
            <select id="children" name="children_count">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
        </div>
        
        <button class="search-btn" type="submit">Bron qilishni yuborish</button>
        
    </form>
</section>


</body>
</html>
